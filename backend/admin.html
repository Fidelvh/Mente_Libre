<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Admin Panel</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    pre { background: #f0f0f0; padding: 15px; border-radius: 5px; overflow-x: auto; }
  </style>
</head>
<body>
  <h1>Admin Panel</h1>
  <pre id="output">Cargando usuarios...</pre>

  <script>
    // ⚠️ Pega aquí tu token generado al loguearte como admin
    const token = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOjcsImVtYWlsIjoiYWRtaW5AYWRtaW4uY29tIiwiaWF0IjoxNzYzNTM1MjY5LCJleHAiOjE3NjQxNDAwNjl9.mbYt_jkSqO7SVVroTwv8B6DnfgJ5vqChrfrPjZEnwCk";

    fetch('http://localhost:4000/api/admin', {
      headers: {
        'Authorization': `Bearer ${token}`
      }
    })
    .then(res => {
      if (!res.ok) throw new Error(`Error ${res.status}: ${res.statusText}`);
      return res.json();
    })
    .then(data => {
      document.getElementById('output').textContent = JSON.stringify(data, null, 2);
    })
    .catch(err => {
      document.getElementById('output').textContent = 'Error: ' + err;
    });
  </script>
</body>
</html>
